<!DOCTYPE html>
<html>
<head>
    <title>Tabel Perkalian 10</title>
</head>
<body>

    <h2>Tabel Perkalian 10</h2>

    <ul>
        <li>NIM: 262302010</li>
        <li>Nama : Rendi Hestu Nugraha</li>
    </ul>

    <script>
        let bilangan = 10;

        for (let i = 1; i <= 10; i++) {
            document.write(
                bilangan + " x " + i + " = " + (bilangan * i) + "<br>"
            );
        }
    </script>

<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Perkalian 8</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #ffffff;
            color: #000000;
        }
        h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        ul {
            list-style-type: disc;
            margin-bottom: 20px;
            padding-left: 20px;
        }
        li {
            font-size: 16px;
            margin-bottom: 4px;
        }
        .tabel-perkalian {
            font-size: 16px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- Judul -->
    <h1>Tabel Perkalian 8</h1>

    <!-- Identitas -->
    <ul>
        <li>NIM: 262302010</li>
        <li>Nama: Rendi Hestu Nugraha</li>
    </ul>

    <!-- Area Hasil Perkalian menggunakan JavaScript -->
    <div class="tabel-perkalian" id="hasilPerkalian"></div>

    <script>
        // Menentukan angka perkalian (angka 8)
        let angka = 8;
        let teks = "";

        // Perulangan for dari 1 sampai 10
        for (let i = 1; i <= 10; i++) {
            let hasil = angka * i;
            teks += `${angka} x ${i} = ${hasil}<br>`;
        }

        // Menampilkan hasil ke elemen HTML
        document.getElementById("hasilPerkalian").innerHTML = teks;
    </script>

</body>
</html>
