<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jam Digital</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a, #1d4ed8);
            font-family: Arial, sans-serif;
            color: white;
        }

        .clock-card {
            width: 90%;
            max-width: 450px;
            padding: 35px 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .clock {
            font-size: clamp(40px, 12vw, 65px);
            font-weight: bold;
            letter-spacing: 3px;
        }

        .date {
            font-size: 17px;
            margin-top: 10px;
            color: #dbeafe;
        }

        .label {
            font-size: 13px;
            letter-spacing: 4px;
            color: #bfdbfe;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="clock-card">
        <div class="label">JAM DIGITAL</div>

        <h1 class="clock" id="jam">00:00:00</h1>

        <div class="date" id="tanggal"></div>

        <div class="mt-4">
            <span class="badge text-bg-light text-primary p-2">
                Waktu lokal perangkat
            </span>
        </div>
    </div>

    <script>
        function tampilkanWaktu() {
            const sekarang = new Date();

            // Menampilkan jam, menit, dan detik
            const jam = sekarang.toLocaleTimeString("id-ID", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            });

            // Menampilkan hari dan tanggal
            const tanggal = sekarang.toLocaleDateString("id-ID", {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            });

            document.getElementById("jam").textContent =
                jam.replace(/\./g, ":");

            document.getElementById("tanggal").textContent =
                tanggal;
        }

        // Perbarui waktu setiap satu detik
        tampilkanWaktu();
        setInterval(tampilkanWaktu, 1000);
    </script>

</body>
</html>
