<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan P4-2 - Penghitung Usia</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1d4ed8);
            font-family: Arial, sans-serif;
        }

        .kartu {
            max-width: 450px;
            width: 100%;
            border: none;
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <!-- Menu Navigasi -->
    <nav class="bg-white p-3">
        <a href="./lat41.html">Latihan P4-1</a>
        <a href="./lat42.html" class="ms-3">Latihan P4-2</a>
    </nav>

    <!-- Konten -->
    <div class="container d-flex justify-content-center align-items-center"
         style="min-height: 85vh;">

        <div class="card kartu shadow p-4">

            <h2 class="text-center text-primary mb-4">
                Penghitung Usia
            </h2>

            <label for="tanggalLahir" class="form-label">
                Tanggal lahir kamu:
            </label>

            <input
                type="date"
                id="tanggalLahir"
                class="form-control"
                value="2007-06-24"
            >

            <p id="hasilUsia" class="mt-4 fw-bold text-success"></p>

            <a href="./index.html" class="btn btn-primary mt-2">
                Kembali ke Biodata
            </a>

        </div>
    </div>

    <script>
        const inputTanggal = document.getElementById("tanggalLahir");
        const hasilUsia = document.getElementById("hasilUsia");

        function hitungUsia() {
            if (inputTanggal.value === "") {
                hasilUsia.textContent = "";
                return;
            }

            const [tahunLahir, bulanLahir, hariLahir] =
                inputTanggal.value.split("-").map(Number);

            const lahir = new Date(
                tahunLahir, bulanLahir - 1, hariLahir
            );

            const sekarang = new Date();

            if (lahir > sekarang) {
                hasilUsia.textContent =
                    "Tanggal lahir tidak boleh di masa depan.";
                hasilUsia.className = "mt-4 fw-bold text-danger";
                return;
            }

            let tahun = sekarang.getFullYear() - tahunLahir;
            let bulan = sekarang.getMonth() - (bulanLahir - 1);
            let hari = sekarang.getDate() - hariLahir;

            if (hari < 0) {
                bulan--;

                const jumlahHari = new Date(
                    sekarang.getFullYear(),
                    sekarang.getMonth(),
                    0
                ).getDate();

                hari += jumlahHari;
            }

            if (bulan < 0) {
                tahun--;
                bulan += 12;
            }

            hasilUsia.className = "mt-4 fw-bold text-success";

            hasilUsia.textContent =
                `Kamu sudah berusia ${tahun} tahun, ` +
                `${bulan} bulan, dan ${hari} hari.`;
        }

        // Batas tanggal lahir sampai hari ini
        const hariIni = new Date();

        inputTanggal.max =
            `${hariIni.getFullYear()}-` +
            `${String(hariIni.getMonth() + 1).padStart(2, "0")}-` +
            `${String(hariIni.getDate()).padStart(2, "0")}`;

        // Jalankan otomatis
        inputTanggal.addEventListener("change", hitungUsia);
        hitungUsia();
    </script>

</body>
</html>
